<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonnington UI Mock</title>
<style>
  body { margin:0; background:#111; color:#ddd; font-family: system-ui, sans-serif; padding:16px; }
  .screen { background:#000; border-radius:8px; position:relative; height:420px; overflow:hidden; max-width:900px; margin:0 auto; }
  canvas { width:100%; height:340px; display:block; }
  #sub { position:absolute; left:0; right:0; bottom:30px; text-align:center; padding:0 60px; color:#fff; font-family: Georgia, "Times New Roman", serif; font-size:15px; line-height:1.55; min-height:48px; }
  #st { position:absolute; top:12px; left:16px; color:#5F5E5A; font-size:11px; font-family: ui-monospace, monospace; }
  .row { display:flex; gap:8px; margin:10px auto 0; flex-wrap:wrap; max-width:900px; }
  button { background:transparent; color:#ddd; border:1px solid #444; border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { background:#222; }
</style>
</head>
<body>
<!-- Agreed mock v3 (2026-11-15). Reference for motion pace, density, mood tint and subtitle style.
     Buttons and the state label exist only for the mock; the real UI has no visible controls. -->
<div class="screen">
  <canvas id="c"></canvas>
  <div id="sub"></div>
  <div id="st">idle · neutral</div>
</div>
<div class="row">
  <button data-s="idle">Idle</button><button data-s="listening">Listening</button><button data-s="thinking">Thinking</button><button data-s="speaking">Speaking</button>
</div>
<div class="row">
  <button data-m="neutral">Neutral</button><button data-m="amused">Amused</button><button data-m="annoyed">Annoyed</button><button data-m="smug">Smug</button><button data-m="serious">Serious</button><button data-m="disappointed">Disappointed</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),sub=document.getElementById('sub'),st=document.getElementById('st');
let W,H;function rs(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}rs();addEventListener('resize',rs);
const N=9000,P=[];for(let i=0;i<N;i++){const u=Math.random()*2-1,th=Math.random()*Math.PI*2;P.push([Math.acos(u),th,Math.random()])}
const M={neutral:[255,255,255],amused:[250,199,117],annoyed:[240,90,80],smug:[175,169,236],serious:[133,183,235],disappointed:[150,150,145]};
const L={neutral:"No exams this week. Two projects pending. Do try to look surprised.",amused:"You named me Britney. I find that genuinely delightful, in the way a car crash is delightful.",annoyed:"Britney. Again. Two hundred and fifteen. I'm keeping receipts.",smug:"Oh, Bonnington. You said it properly. Was that so hard?",serious:"DBMS exam tomorrow, nine a.m. Unit four is untouched. Open it now.",disappointed:"Medrag. Forty-one days. I won't say anything. I'll just let that sit."};
let state='idle',mood='neutral',col=[255,255,255],amp=0,tAmp=0,spin=.05,tSpin=.05,scale=1,tScale=1,subT=null;
function lbl(){st.textContent=state+' · '+mood}
function typeL(){clearInterval(subT);let i=0;const s=L[mood];subT=setInterval(()=>{i++;sub.textContent=s.slice(0,i);if(i>=s.length)clearInterval(subT)},62)}
function setS(s){state=s;lbl();clearInterval(subT);
if(s==='idle'){tSpin=.05;tScale=1;sub.textContent=''}
if(s==='listening'){tSpin=.03;tScale=.9;sub.innerHTML='<span style="color:#5F5E5A">"Hey Britney, what\'s left this week?"</span>'}
if(s==='thinking'){tSpin=.18;tScale=.95;sub.textContent=''}
if(s==='speaking'){tSpin=.06;tScale=1.03;typeL()}}
document.querySelectorAll('button[data-s]').forEach(b=>b.onclick=()=>setS(b.dataset.s));
document.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{mood=b.dataset.m;lbl();if(state!=='speaking')setS('speaking');else typeL()});
let t=0,rot=0;function f(){t+=.016;spin+=(tSpin-spin)*.02;scale+=(tScale-scale)*.02;rot+=spin*.016;
const tc=M[mood];for(let k=0;k<3;k++)col[k]+=(tc[k]-col[k])*.015;
tAmp=state==='speaking'?(.05+.04*(.5+.5*Math.sin(t*2.2)*Math.sin(t*.9))):state==='listening'?.02:.01;amp+=(tAmp-amp)*.04;
ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
const R=Math.min(W,H)*.37*scale,cx=W/2,cy=H/2;
const g=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R*1.5),c=col.map(v=>Math.round(v)).join(',');
g.addColorStop(0,'rgba('+c+',0.06)');g.addColorStop(1,'rgba('+c+',0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const ca=Math.cos(rot),sa=Math.sin(rot),tl=.35,ct=Math.cos(tl),stt=Math.sin(tl),ts=t*.25;
for(const p of P){const ph=p[0],th=p[1];
const n=Math.sin(ph*3+ts*.7)*Math.cos(th*2-ts*.5)+Math.sin(th*4+ph*2+ts)*.4;
const band=Math.exp(-Math.pow((ph-2.2+.3*Math.sin(th*2+ts*.4)),2)*6);
const r=R*(1+.07*n+amp*Math.sin(th*3+ph*2+t*1.6)*(.4+band)+(p[2]-.5)*.05);
let x=r*Math.sin(ph)*Math.cos(th),y=r*Math.cos(ph),z=r*Math.sin(ph)*Math.sin(th);
let x2=x*ca-z*sa,z2=x*sa+z*ca;let y2=y*ct-z2*stt,z3=y*stt+z2*ct;
const d=(z3/R+1)/2;const a=Math.min(.9,(.1+.45*d)*(.3+band*1.1));
const w=band*.6+.2;const rr=Math.round(255*(1-w)+col[0]*w),gg=Math.round(255*(1-w)+col[1]*w),bb=Math.round(255*(1-w)+col[2]*w);
ctx.fillStyle='rgba('+rr+','+gg+','+bb+','+a.toFixed(3)+')';ctx.fillRect(cx+x2,cy-y2,1,1)}
requestAnimationFrame(f)}f();
</script>
</body>
</html>
