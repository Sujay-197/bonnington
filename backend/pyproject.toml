[project]
name = "bonnington"
version = "0.1.0"
description = "Bonnington: a local voice companion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "websockets>=15",
    "ollama>=0.6",
    "httpx>=0.28",
    "sounddevice>=0.5",
    "onnxruntime>=1.22",
    "pystray>=0.19",
    "pillow>=11",
    "pynput>=1.8",
]

[project.optional-dependencies]
ml = [
    "torch>=2.8",
    "faster-qwen3-tts",
    "transformers>=4.57,<5",
    "sherpa-onnx>=1.12",
    "sentencepiece>=0.2",
    "soundfile>=0.13",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1"]

[tool.uv]
package = true
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bonnington"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["hw: needs real hardware or models; run manually with -m hw"]
addopts = "-m 'not hw'"
